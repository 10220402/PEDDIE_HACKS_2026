<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HealthLens History</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header>

        <h1>❤️ HealthLens</h1>

        <p>
            Your HealthLens conversation history
        </p>

    </header>


    <main>

        <section class="history-box">

            <div class="history-header">

                <div>

                    <h2>📚 Conversation History</h2>

                    <p>
                        Your previous HealthLens conversations
                    </p>

                </div>


                <a
                    href="index.html"
                    class="back-button"
                >
                    ← Back to Chat
                </a>

            </div>


            <div id="historyContainer">

                <div class="loading">
                    Loading history...
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            HealthLens is for educational purposes only.
        </p>

    </footer>


    <script src="history.js"></script>

</body>

</html>
